<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LOOM ICON - 服装图标库</title>

<!-- 兼容现代浏览器（如果用PNG格式） -->
<link rel="icon" href="./assets/favicon.png" sizes="32x32" type="image/png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Logo和Hero标题字体 */
  .logo, .hero h1 {
    font-family: 'Lexend', sans-serif;
    font-weight: 500;
    letter-spacing: 1px;
    color: #1a2b48;
    text-transform: uppercase;
  }
  /* Logo字号缩小一半 */
  .logo {
    font-size: 1rem;
  }
  .hero h1 {
    font-size: 3.2rem;
    margin-bottom: 1rem !important;
  }
  /* 核心：header容器和搜索框对齐 */
  .header-container {
    max-width: 1560px;
    margin: 0 auto;
    padding: 0 160px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  /* 响应式适配 */
  @media (max-width: 768px) {
    .hero h1 {
      font-size: 2.4rem;
    }
    .logo {
      font-size: 0.85rem;
    }
    .header-container {
      padding: 0 20px;
    }
  }
</style>
</head>
<body>
  
<header>
  <div class="header-container">
    <div class="logo">LOOM ICON</div>
    <div class="header-right">
      <!-- 原有GitHub链接按钮（保留不动） -->
      <a href="https://github.com/aglt2w/loomicon" target="_blank" class="github-btn" title="前往GitHub仓库">
        <span class="github-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
        </span>
      </a>
      <!-- 管理员后台入口按钮 -->
      <a href="./admin.html" class="admin-btn" title="管理员后台">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L21 5V11C21 16.55 17.16 21.74 12 23C6.84 21.74 3 16.55 3 11V5L12 1ZM12 3.188L5 6.354V11C5 15.42 7.96 19.61 12 20.93C16.04 19.61 19 15.42 19 11V6.354L12 3.188ZM12 7C13.6569 7 15 8.34315 15 10C15 11.3062 14.1652 12.4175 13 12.8293V16H11V12.8293C9.8348 12.4175 9 11.3062 9 10C9 8.34315 10.3431 7 12 7Z"></path>
        </svg>
      </a>
      <!-- 密码验证锁形按钮（保留不动） -->
      <button class="auth-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 10H20C20.5523 10 21 10.4477 21 11V21C21 21.5523 20.5523 22 20 22H4C3.44772 22 3 21.5523 3 21V11C3 10.4477 3.44772 10 4 10H5V9C5 5.13401 8.13401 2 12 2C15.866 2 19 5.13401 19 9V10ZM17 10V9C17 6.23858 14.7614 4 12 4C9.23858 4 7 6.23858 7 9V10H17ZM11 14V18H13V14H11Z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
<!-- 修复核心：弹窗移出header，和header同级，独立存在 + 闭合所有标签 + 删除重复的auth-modal-content -->
<div class="auth-modal">
  <div class="auth-modal-mask"></div>
  <div class="auth-modal-content">
    <!-- 标题+关闭按钮容器 -->
    <div class="auth-header">
      <h3 class="auth-title">内部资源验证</h3>
      <button class="auth-close-btn">×</button>
    </div>
    <!-- 密码输入框（保留原有类名） -->
    <input type="password" class="auth-input" placeholder="请输入内部验证密码" autocomplete="off">
    <!-- 错误提示（保留原有类名） -->
    <p class="auth-error"></p>
    <!-- 7天内无需重复验证：改造为你指定的SVG复选框（核心修改） -->
    <label class="auth-remember">
      <!-- 原生checkbox：隐藏视觉，保留选中逻辑 -->
      <input type="checkbox" class="remember-checkbox">
      <!-- 未选中：你指定的黑色矩形SVG -->
      <svg class="uncheck-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="rgba(0,0,0,1)">
        <path d="M4 3H20C20.5523 3 21 3.44772 21 4V20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V4C3 3.44772 3.44772 3 4 3ZM5 5V19H19V5H5Z"></path>
      </svg>
      <!-- 选中：你指定的黄色对钩SVG（fill和验证按钮黄色一致） -->
      <svg class="check-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="rgba(245,179,44,1)">
        <path d="M4 3H20C20.5523 3 21 3.44772 21 4V20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V4C3 3.44772 3.44772 3 4 3ZM11.0026 16L18.0737 8.92893L16.6595 7.51472L11.0026 13.1716L8.17421 10.3431L6.75999 11.7574L11.0026 16Z"></path>
      </svg>
      7天内无需重复验证
    </label>
    <!-- 验证按钮（保留扩散动画类名） -->
    <button class="auth-submit-btn">验证并进入</button>
  </div>
</div>

<section class="hero">
  <!-- 新增：标题上方的横幅（无独立背景，和hero融为一体） -->
  <div class="title-banner">
    <!-- 右侧浅灰底框容器（包裹黑框+右侧文字） -->
    <div class="banner-right-wrap">
      <!-- 左侧黑框 -->
      <span class="banner-left">cooalt</span>
      <!-- 右侧文字 -->
      <span class="banner-right">Design by cooalt & Ai</span>
    </div>
  </div>
  <h1>LOOM ICON</h1>
  <p>高品质服装图标资源站｜服装图标免费商用</p>
  <div class="features">
    <div class="feature-item">
      <svg class="feature-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="22" y1="12" x2="18" y2="12"></line>
        <line x1="6" y1="12" x2="2" y2="12"></line>
        <line x1="12" y1="6" x2="12" y2="2"></line>
        <line x1="12" y1="22" x2="12" y2="18"></line>
      </svg>
      <span>Pixel Perfect</span>
    </div>
    <div class="feature-item">
      <svg class="feature-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
        <path d="M2 2l7.586 7.586"></path>
        <circle cx="11" cy="11" r="2"></circle>
      </svg>
      <span>Vector</span>
    </div>
    <div class="feature-item">
      <svg class="feature-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"></path>
      </svg>
      <span>Consistency</span>
    </div>
  </div>
</section>

<section class="search-section">
  <div class="search-container">
    <div class="custom-select-wrapper" id="custom-select-wrapper">
      <div class="custom-select-btn" id="custom-select-btn">
        <span class="selected-text" id="selected-category">全部图标</span>
        <svg class="select-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
          <path d="M11.9999 13.1714L16.9497 8.22168L18.3639 9.63589L11.9999 15.9999L5.63599 9.63589L7.0502 8.22168L11.9999 13.1714Z"></path>
        </svg>
      </div>
    </div>
    <input type="text" id="search-input" class="search-input" placeholder="搜索图标..." autocomplete="off">
    <div class="search-icon-wrap">
      <div class="search-icon" id="search-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
          <path d="M11 2C15.968 2 20 6.032 20 11C20 15.968 15.968 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2ZM11 18C14.8675 18 18 14.8675 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18ZM19.4853 18.0711L22.3137 20.8995L20.8995 22.3137L18.0711 19.4853L19.4853 18.0711Z" fill="#bcc1cc"></path>
        </svg>
      </div>
    </div>
  </div>
</section>

<section class="icon-grid-section" id="icon-grid-section">
  <!-- 新增内层对齐容器 -->
  <div class="icons-inner-container">
    <div id="icon-categories-container"></div>
    <!-- 原有的图标网格容器也放在这个内层容器里 -->
  </div>
</section>

<footer>
  <p>© 2026 LOOM ICON. ALL RIGHTS RESERVED.</p>
  <p>服装图标库｜高品质图标资源供应，服装类图标可免费商用 · <a href="./admin.html" class="admin-entry-link">管理员入口</a></p>
</footer>

<!-- 图标放大预览弹窗：点击图标卡片弹出，放大展示图标 + 下载/复制功能 -->
<div class="icon-preview-modal" id="icon-preview-modal" aria-hidden="true">
  <div class="icon-preview-mask" id="icon-preview-mask"></div>
  <div class="icon-preview-content">
    <button class="icon-preview-close" id="icon-preview-close" type="button" aria-label="关闭预览">×</button>
    <div class="icon-preview-body">
      <div class="icon-preview-artboard">
        <div class="icon-preview-svg" id="icon-preview-svg"></div>
      </div>
      <div class="icon-preview-meta">
        <h3 class="icon-preview-name" id="icon-preview-name"></h3>
        <span class="icon-preview-cat" id="icon-preview-cat"></span>
        <div class="icon-preview-actions">
          <button class="icon-preview-btn preview-download-btn" id="icon-preview-download-btn" type="button"></button>
          <button class="icon-preview-btn preview-copy-btn" id="icon-preview-copy-btn" type="button"></button>
        </div>
        <p class="icon-preview-tip">点击上方按钮，可直接下载 SVG 文件或复制 SVG 代码</p>
      </div>
    </div>
  </div>
</div>

<!-- 分类下拉列表：移出 search-container，避免被父级 backdrop-filter 影响而丢失模糊 -->
<div class="custom-select-list" id="custom-select-list"></div>

<!-- Supabase 数据层（公开端用） -->
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>

<script src="js/script.js"></script>
</body>
</html>
